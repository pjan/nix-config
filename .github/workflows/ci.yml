name: "CI"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    name: Evaluate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Apply CI config stub
        run: cp ci/config-stub.nix config.nix

      - name: Evaluate darwin configuration
        run: |
          nix build '.#darwinConfigurations.aarch64-darwin.system' \
            --override-input secrets 'path:./ci/secrets-stub' \
            --dry-run

  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = s3://io-vandaele-nix-cache?endpoint=https://storage.googleapis.com&profile=gcp
            extra-trusted-public-keys = io-vandaele-nix-cache:O9fdSbSnySVmQFa353NjmU/lP5GifyVfOmDM2XhBs8Q=

      - name: Apply CI config stub
        run: cp ci/config-stub.nix config.nix

      - name: Build darwin configuration
        run: |
          nix build '.#darwinConfigurations.aarch64-darwin.system' \
            --override-input secrets 'path:./ci/secrets-stub' \
            --dry-run
