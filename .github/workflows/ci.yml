name: "CI"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    name: Discover hosts
    runs-on: ubuntu-24.04
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - id: hosts
        run: |
          hosts=$(nix eval '.#darwinConfigurations' --apply builtins.attrNames --json \
            --override-input secrets 'path:./ci/secrets-stub')
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

  eval:
    name: Evaluate ${{ matrix.host }} (Linux)
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.discover.outputs.hosts) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Evaluate darwin configuration
        run: |
          nix build '.#darwinConfigurations.${{ matrix.host }}.system' \
            --override-input secrets 'path:./ci/secrets-stub' \
            --dry-run

  build:
    name: Build ${{ matrix.host }} (macOS)
    needs: discover
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.discover.outputs.hosts) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = s3://io-vandaele-nix-cache?endpoint=https://storage.googleapis.com&profile=gcp
            extra-trusted-public-keys = io-vandaele-nix-cache:O9fdSbSnySVmQFa353NjmU/lP5GifyVfOmDM2XhBs8Q=

      - name: Build darwin configuration
        run: |
          nix build '.#darwinConfigurations.${{ matrix.host }}.system' \
            --override-input secrets 'path:./ci/secrets-stub' \
            --dry-run
