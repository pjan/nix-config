name: "Update Inputs"

on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # Full build on macOS and push to the GCS cache before opening the PR, so a PR
    # only exists when the system builds and merging it gives instant cache hits.
    runs-on: macos-15
    env:
      NIXPKGS_ALLOW_UNFREE: "1"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Free disk space
        run: |
          # macOS runners ship with Xcode simulators and other tooling we don't need.
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/ || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/ || true
          sudo rm -rf /Applications/Xcode_*.app || true
          sudo rm -rf /opt/homebrew/share/dotnet/ || true
          sudo rm -rf /opt/homebrew/opt/mono/ || true
          df -h /

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = s3://io-vandaele-nix-cache?endpoint=https://storage.googleapis.com&profile=gcp
            extra-trusted-public-keys = io-vandaele-nix-cache:O9fdSbSnySVmQFa353NjmU/lP5GifyVfOmDM2XhBs8Q=

      - name: Update flake inputs (excluding homebrew taps)
        run: |
          nix flake update \
            nixpkgs \
            home-manager \
            darwin \
            agenix \
            nix-homebrew \
            nix-claude-code \
            codex-cli-nix \
            nix-pkgs \
            beatport-dl \
            riptide \
            systems

      - name: Apply CI config stub
        run: cp ci/config-stub.nix config.nix

      - name: Write GCS credentials
        env:
          GCS_KEY_ID: ${{ secrets.GCS_HMAC_ACCESS_KEY_ID }}
          GCS_SECRET: ${{ secrets.GCS_HMAC_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          printf '[gcp]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$GCS_KEY_ID" "$GCS_SECRET" > "$RUNNER_TEMP/gcs-credentials"
          echo "AWS_SHARED_CREDENTIALS_FILE=$RUNNER_TEMP/gcs-credentials" >> "$GITHUB_ENV"
          # The nix daemon substitutes as root and does not see the env above.
          sudo mkdir -p /var/root/.aws
          sudo install -m 600 "$RUNNER_TEMP/gcs-credentials" /var/root/.aws/credentials

      - name: Build darwin configuration with updated inputs
        run: |
          # --max-jobs 1: parallel builds exhaust runner memory.
          nix build '.#darwinConfigurations.aarch64-darwin.system' \
            --override-input secrets 'path:./ci/secrets-stub' \
            --max-jobs 1 \
            --print-build-logs

      - name: Write nix signing key
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s' "$NIX_SIGNING_KEY" > "$RUNNER_TEMP/nix-signing-key"

      - name: Sign store paths
        run: |
          nix store sign --recursive \
            -k "$RUNNER_TEMP/nix-signing-key" \
            "$(readlink ./result)"

      - name: Push to GCS cache
        run: |
          nix copy \
            --to "s3://io-vandaele-nix-cache?endpoint=https://storage.googleapis.com&profile=gcp" \
            "$(readlink ./result)"

      - name: Capture lock diff
        run: |
          {
            echo "LOCK_DIFF<<EOF"
            git diff flake.lock
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Open pull request if inputs changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Only the lock; config.nix is overwritten with the CI stub above.
          add-paths: flake.lock
          branch: update/flake-lock
          commit-message: "chore(flake): update inputs"
          title: "chore(flake): update inputs"
          body: |
            Automated weekly update of flake inputs (homebrew taps excluded).
            Built on macOS and pushed to the GCS cache before this PR was opened.

            <details>
            <summary>flake.lock diff</summary>

            ```
            ${{ env.LOCK_DIFF }}
            ```

            </details>
          labels: "dependencies"
          delete-branch: true

      - name: Cleanup
        if: always()
        run: |
          [ -L ./result ] && unlink ./result || true
          rm -f "$RUNNER_TEMP/nix-signing-key"
          rm -f "${AWS_SHARED_CREDENTIALS_FILE:-$RUNNER_TEMP/gcs-credentials}"
          sudo rm -f /var/root/.aws/credentials
